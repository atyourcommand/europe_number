<script>
(function () {
   function initScroller(wrapperSel, innerSel, speed) {
      var wrapper = document.querySelector(wrapperSel);
      var inner   = document.querySelector(innerSel);
      if (!wrapper || !inner) return;

      // Clone items for infinite loop
      Array.from(inner.children).forEach(function (item) {
         var clone = item.cloneNode(true);
         clone.setAttribute('aria-hidden', 'true');
         inner.appendChild(clone);
      });

      var pos    = 0;
      var paused = false;
      var loopAt = 0;

      function getLoopAt() {
         if (!loopAt) loopAt = inner.scrollWidth / 2;
         return loopAt;
      }

      function wrapPos(p) {
         var l = getLoopAt();
         return ((p % l) + l) % l;
      }

      function step() {
         if (!paused) {
            pos += speed;
            if (pos >= getLoopAt()) pos = 0;
            inner.style.transform = 'translateX(-' + pos + 'px)';
         }
         requestAnimationFrame(step);
      }

      wrapper.addEventListener('mouseenter', function () { if (!dragging) paused = true; });
      wrapper.addEventListener('mouseleave', function () { if (!dragging) paused = false; });

      var dragging     = false;
      var dragStartX   = 0;
      var dragStartPos = 0;
      var didDrag      = false;

      inner.addEventListener('mousedown', function (e) {
         dragging           = true;
         paused             = true;
         dragStartX         = e.clientX;
         dragStartPos       = pos;
         didDrag            = false;
         inner.style.cursor = 'grabbing';
         e.preventDefault();
      });

      document.addEventListener('mousemove', function (e) {
         if (!dragging) return;
         var delta = dragStartX - e.clientX;
         if (Math.abs(delta) > 3) didDrag = true;
         pos = wrapPos(dragStartPos + delta);
         inner.style.transform = 'translateX(-' + pos + 'px)';
      });

      document.addEventListener('mouseup', function () {
         if (!dragging) return;
         dragging           = false;
         inner.style.cursor = '';
         setTimeout(function () { paused = false; }, 1200);
      });

      var touchStartX   = 0;
      var touchStartPos = 0;
      var touchHoriz    = null;

      wrapper.addEventListener('touchstart', function (e) {
         touchStartX   = e.touches[0].clientX;
         touchStartPos = pos;
         touchHoriz    = null;
         paused        = true;
      }, { passive: true });

      wrapper.addEventListener('touchmove', function (e) {
         var dx = e.touches[0].clientX - touchStartX;
         if (touchHoriz === null) touchHoriz = true;
         if (!touchHoriz) return;
         e.preventDefault();
         pos = wrapPos(touchStartPos - dx);
         inner.style.transform = 'translateX(-' + pos + 'px)';
      }, { passive: false });

      wrapper.addEventListener('touchend', function () {
         setTimeout(function () { paused = false; }, 2000);
      });

      inner.addEventListener('click', function (e) {
         if (didDrag) { didDrag = false; e.preventDefault(); e.stopPropagation(); }
      });

      requestAnimationFrame(step);
   }

   initScroller(
      '.module-product-gallery .scroll-wrapper',
      '.module-product-gallery .scroll-inner',
      0.4
   );
})();
</script>
